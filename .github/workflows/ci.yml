name: windows acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      TCA_TEST_PYTHON: python
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10' # Last Python 3.12 release with a Windows x64 build.
          architecture: 'x64'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '26.1.0'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: npm.cmd ci
      - run: npx.cmd playwright install chromium
      - run: python -m tools.distribution check
      - run: python -m tools.distribution release
